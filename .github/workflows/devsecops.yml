name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code source
      uses: actions/checkout@v4
      
    - name: Dependances
      run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:0.57.0 fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /project/requirements.txt
  
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        
      - name: Test Dockerfile
        run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:0.57.0 config --severity HIGH,CRITICAL --exit-code 1 /project
          
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
